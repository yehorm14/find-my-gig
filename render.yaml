services:
  - type: web
    name: find-my-gig
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python population_script.py
    # Re-seed on every start: the free plan's disk is ephemeral, so a cold start
    # may begin with an empty database. The script skips seeding if users exist.
    startCommand: python manage.py migrate --noinput && python population_script.py && gunicorn find_my_gig.wsgi
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: BEHIND_PROXY
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: SERVE_MEDIA
        value: "true"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: GOOGLE_MAPS_FRONTEND_KEY
        sync: false
      - key: GOOGLE_MAPS_BACKEND_KEY
        sync: false
