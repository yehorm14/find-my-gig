services:
  - type: web
    name: find-my-gig
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python population_script.py
    startCommand: gunicorn find_my_gig.wsgi
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: BEHIND_PROXY
        value: "true"
      - key: SERVE_MEDIA
        value: "true"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: GOOGLE_MAPS_FRONTEND_KEY
        sync: false
      - key: GOOGLE_MAPS_BACKEND_KEY
        sync: false
